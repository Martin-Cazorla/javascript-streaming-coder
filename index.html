<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KaijuStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KaijuStream: plataforma de anime en streaming.">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div id="app-loader" class="loader hidden" aria-hidden="true">
    <div class="spinner"></div>
</div>

<header class="site-header">
    <h1>KaijuStream</h1>

    <nav class="nav-auth" aria-label="Autenticación usuario">
        <button id="btn-login">Login</button>
        <button id="btn-logout" class="hidden">Logout</button>
    </nav>
</header>

<main>
    <section class="hero">
        <h2>Tu plataforma de anime favorita</h2>
        <p>Planes accesibles y contenido exclusivo.</p>
        <button id="btn-comenzar" aria-label="Ver planes disponibles">
            Comenzar
        </button>
    </section>

    <section id="planes-skeleton" class="planes hidden">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </section>

    <section id="planes-container" class="planes hidden"></section>

    <section id="perfil-container" class="hidden"></section>

</main>

<footer class="site-footer">
    <p>© 2026 KaijuStream</p>
</footer>

<script type="module" src="js/pages/index.js"></script>


</body>
</html>
