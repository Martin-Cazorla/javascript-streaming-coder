<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo | KaijuStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/favicon.ico">
</head>

<body class="catalog-page">

    <header class="site-header">
        <div class="header-container">
            <a href="../index.html" class="logo-link">
                <img src="../assets/icons/logo-kaiju-stream.png" alt="KaijuStream Home" class="logo-img">
            </a>
            <nav class="nav-auth">
                <span id="user-display"></span>
                <button id="btn-edit-profile" class="btn-secondary">Perfil</button>
                <button id="btn-logout" class="btn-danger">Salir</button>
            </nav>
        </div>
    </header>

    <main class="catalog-layout">
        <section class="filters-bar">
            <input type="text" id="search-input" placeholder="Buscar anime...">
            <select id="genre-filter">
                <option value="all">Todos los géneros</option>
                <option value="shonen">Shonen</option>
                <option value="seinen">Seinen</option>
            </select>
        </section>

        <div class="content-wrapper">
            <section id="anime-grid" class="anime-grid">
                </section>

            <aside class="sidebar-favorites">
                <div id="mis-suscripciones-lista" class="favorites-container">
                    </div>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <img src="../assets/icons/logo-kaiju-stream.png" alt="KaijuStream" class="footer-logo">
                <p>La mejor plataforma de streaming para los amantes del anime y los Kaijus.</p>
            </div>
            <div class="footer-links">
                <h4>Navegación</h4>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="pages/catalog.html">Catálogo</a></li>
                    <li><a href="#">Planes</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <h4>Soporte</h4>
                <ul>
                    <li><a href="#">Ayuda</a></li>
                    <li><a href="#">Términos</a></li>
                    <li><a href="#">Privacidad</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 KaijuStream. Todos los derechos reservados.</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/pages/catalog.js"></script>
</body>
</html>
