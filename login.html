<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - KaijuStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ingreso a KaijuStream">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-card">

        <h1>KaijuStream</h1>
        <h2>Iniciar sesión</h2>

        <form id="loginForm">
        <input 
          type="email" 
          placeholder="Email"
          required
        />

        <input 
          type="password"
          placeholder="Contraseña"
          required
        />

        <button type="submit">
          Ingresar
        </button>
      </form>

    </main>

</body>

</html>
