<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - KaijuStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ingreso a KaijuStream">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-card">
            <h1>KaijuStream</h1>
            <h2>Iniciar sesión</h2>

            <form id="loginForm">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@kaiju.com" required />

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required />

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <button type="button" id="btn-back-home" class="btn-back">
                Volver al inicio
            </button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./js/pages/login.js"></script>
    
</body>
</html>
